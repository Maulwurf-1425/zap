[package]
name = "zap"
version = "0.4.1"
description = "ZAP – local-first AI chat"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
# rustls for the optional web tools (search, page fetch); model servers stay on loopback.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
scraper = "0.29.0"
keyring = { version = "3.6.3", features = ["windows-native"] }
url = "2.5.8"
walkdir = "2.5.0"
trash = "5.2.3"
similar = "2.7.0"
base64 = "0.23.1"
notify = "8.2.0"
dirs = "7.0.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.17.3"
hound = "3.5.1"
sha2 = "0.10.9"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
discord-rich-presence = "1.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
